[package]
name = "loadform"
# Not the shipped app version — tauri.conf.json reads that from ../package.json.
# Kept in sync only so `cargo` metadata isn't misleading.
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loadform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
ollama-rs = { version = "0.3", features = ["headers"] }

# Audio capture (cross-platform)
cpal = "0.15"

# Async runtime + websockets for Deepgram streaming
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
url = "2"
bytes = "1"
http = "1"
futures-util = "0.3"

# Layer-shell window positioning (Wayland-native). Only on Linux — the FFI
# links against the system gtk-layer-shell library via build.rs.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
bytemuck = "1"

